server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        try_files /index.html =503;
    }

    # Versioned assets are immutable; entry points are always revalidated.
    location ~ "^/v[0-9]{2}\.[0-9]{2}\.[0-9]{2}/assets/" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Missing static resources must not return HTML.
    location ~* \.(?:js|css|map|json|svg|png|jpg|jpeg|gif|webp|ico|ttf|woff2?)$ {
        try_files $uri =404;
    }

    location ~ ^/(?<release>v[^/]+)(?:/|$) {
        try_files $uri $uri/ /$release/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
